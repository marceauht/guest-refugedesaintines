<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Canapé-lit – Tutoriels – Le Refuge de Saintines</title>

    <meta name="description" content="Tutoriel d'utilisation du canapé convertible du Refuge de Saintines.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07100c">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" href="images/lrds-logo.png" type="image/png">

    <link rel="stylesheet" href="css/base/00-tokens.css">
    <link rel="stylesheet" href="css/base/01-reset-base.css">
    <link rel="stylesheet" href="css/base/02-typography.css">
    <link rel="stylesheet" href="css/base/03-layout.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/separators.css">
    <link rel="stylesheet" href="css/components/cards.css">
    <link rel="stylesheet" href="css/components/footer.css">
    <link rel="stylesheet" href="css/pages/tutoriels.css">
</head>

<body>
<a class="skip-link" href="#contenu-principal">Aller au contenu</a>

<header class="guest-header">
    <div class="header-inner">
        <div class="header-brand">
            <img src="images/lrds-logo.png" alt="Logo Le Refuge de Saintines" class="guest-logo">
            <div class="guest-title">
                <span class="logo">Portail Voyageurs</span>
                <small class="sub">Votre séjour en toute simplicité</small>
            </div>
        </div>
        <a href="tutoriels.html" class="header-return">← Retour</a>
    </div>
</header>

<main id="contenu-principal">
    <section class="page-hero">
        <div class="guest-container">
            <h1 class="reveal">🛋️ Canapé-lit</h1>
            <p class="page-intro reveal reveal-delay-1">
                Retrouvez ici deux vidéos explicatives sur le dépliage / repliage du canapé convertible.
            </p>
        </div>
    </section>

    <section class="page-section">
        <div class="guest-container">
            <div class="section-separator reveal"></div>
        </div>
    </section>

    <div class="tutorial-video-block reveal">
        <div class="video-wrapper">
            <video id="tutorialVideo" controls preload="metadata" playsinline poster="">
                <source id="tutorialVideoSource" src="images/tutoriels/canape-mode-lit.mp4" type="video/mp4">
                Votre navigateur ne supporte pas la lecture vidéo.
            </video>
        </div>

        <a id="tutorialModeBtn" href="#" class="btn-pill btn-primary tutorial-mode-btn">
            Mode canapé →
        </a>
    </div>
</main>

<footer class="guest-footer">
    <div class="guest-container">
        <p>© Le Refuge de Saintines — Portail Voyageurs</p>
        <p>
            <a href="https://gite-refugedesaintines.com" target="_blank" rel="noopener">
                Accéder au site public →
            </a>
        </p>
    </div>
</footer>

<script src="js/guest.js"></script>
<script>
(function () {
    const btnEl = document.getElementById('tutorialModeBtn');
    const videoEl = document.getElementById('tutorialVideo');
    const sourceEl = document.getElementById('tutorialVideoSource');

    if (!btnEl || !videoEl || !sourceEl) return;

    const SRC_LIT = 'images/tutoriels/canape-mode-lit.mp4';
    const SRC_CANAPE = 'images/tutoriels/canape-mode-canape.mp4';

    let mode = 'lit';

    function updateButton() {
        btnEl.textContent = (mode === 'lit') ? 'Mode canapé →' : 'Mode lit →';
        btnEl.setAttribute('aria-label', btnEl.textContent);
    }

    function switchVideo(nextMode) {
        if (nextMode === mode) return;
        mode = nextMode;

        const wasPlaying = !videoEl.paused && !videoEl.ended;
        const nextSrc = (mode === 'lit') ? SRC_LIT : SRC_CANAPE;
        sourceEl.setAttribute('src', nextSrc);

        videoEl.load();
        videoEl.currentTime = 0;

        videoEl.addEventListener('loadedmetadata', () => {
            if (wasPlaying) {
                const p = videoEl.play();
                if (p && typeof p.catch === 'function') p.catch(() => {});
            }
        }, { once: true });

        updateButton();
    }

    btnEl.addEventListener('click', (e) => {
        e.preventDefault();
        switchVideo(mode === 'lit' ? 'canape' : 'lit');
    });

    updateButton();
})();
</script>
</body>
</html>
