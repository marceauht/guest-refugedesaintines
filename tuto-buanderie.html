<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Buanderie – Tutoriels – Le Refuge de Saintines</title>

    <meta name="description" content="Tutoriel buanderie (lave-linge et sèche-linge) du Refuge de Saintines.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07100c">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" href="images/lrds-logo.png" type="image/png">

    <link rel="stylesheet" href="css/base/00-tokens.css">
    <link rel="stylesheet" href="css/base/01-reset-base.css">
    <link rel="stylesheet" href="css/base/02-typography.css">
    <link rel="stylesheet" href="css/base/03-layout.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/buttons.css">
    <link rel="stylesheet" href="css/components/separators.css">
    <link rel="stylesheet" href="css/components/cards.css">
    <link rel="stylesheet" href="css/components/footer.css">
    <link rel="stylesheet" href="css/pages/tutoriels.css">
</head>

<body>
<a class="skip-link" href="#contenu-principal">Aller au contenu</a>

<header class="guest-header">
    <div class="header-inner">
        <div class="header-brand">
            <img src="images/lrds-logo.png" alt="Logo Le Refuge de Saintines" class="guest-logo">
            <div class="guest-title">
                <span class="logo">Portail Voyageurs</span>
                <small class="sub">Votre séjour en toute simplicité</small>
            </div>
        </div>
        <a href="tutoriels.html" class="header-return">← Retour</a>
    </div>
</header>

<main id="contenu-principal">
    <section class="page-hero">
        <div class="guest-container">
            <h1 class="reveal">🧺 Buanderie</h1>
            <p class="page-intro reveal reveal-delay-1">
                Retrouvez ici un guide rapide pour utiliser le lave-linge et le sèche-linge.
            </p>
        </div>
    </section>

    <section class="page-section">
        <div class="guest-container">
            <div class="section-separator reveal"></div>
        </div>
    </section>

    <section class="tutorial-card-section">
        <div class="guest-container">

            <div class="tutorial-card reveal">
                <h2 class="tutorial-subtitle" id="laundryTitle">Lave-linge</h2>

                <div class="tutorial-photo-stack">
                    <img id="laundryImg1" src="images/tutoriels/washer-screen.webp" alt="Lave-linge — commandes (écran)" class="tutorial-photo">
                    <img id="laundryImg2" src="images/tutoriels/washer-selector.webp" alt="Lave-linge — sélecteur de programme" class="tutorial-photo">
                </div>

                <ul class="tutorial-steps" id="laundrySteps"></ul>
            </div>

            <a id="laundrySwitchBtn" href="#" class="btn-pill btn-primary tutorial-mode-btn">
                Voir le sèche-linge →
            </a>

        </div>
    </section>
</main>

<footer class="guest-footer">
    <div class="guest-container">
        <p>© Le Refuge de Saintines — Portail Voyageurs</p>
        <p>
            <a href="https://gite-refugedesaintines.com" target="_blank" rel="noopener">
                Accéder au site public →
            </a>
        </p>
    </div>
</footer>

<script src="js/guest.js"></script>
<script>
(function () {
    const titleEl = document.getElementById('laundryTitle');
    const img1El  = document.getElementById('laundryImg1');
    const img2El  = document.getElementById('laundryImg2');
    const stepsEl = document.getElementById('laundrySteps');
    const btnEl   = document.getElementById('laundrySwitchBtn');
    const cardEl  = stepsEl ? stepsEl.closest('.tutorial-card') : null;

    if (!titleEl || !img1El || !img2El || !stepsEl || !btnEl) return;

    const DATA = {
        washer: {
            title: 'Lave-linge',
            img1: { src: 'images/tutoriels/washer-screen.webp', alt: 'Lave-linge — commandes (écran)' },
            img2: { src: 'images/tutoriels/washer-selector.webp', alt: 'Lave-linge — sélecteur de programme' },
            stepsHtml: `
                <li>
                    <span class="step-title">1️⃣ Ajouter la lessive</span>
                    <ul>
                        <li>Des pods sont disponibles en libre-service.</li>
                        <li>Mettre <strong>1 pod directement dans le tambour</strong>, puis ajouter les vêtements.</li>
                    </ul>
                </li>
                <li>
                    <span class="step-title">2️⃣ Choisir un programme</span>
                    <ul>
                        <li>Tourner le bouton central.</li>
                        <li>Programmes recommandés :</li>
                        <li>
                            <ul>
                                <li><strong>Mix</strong> → cercle à gauche du sélecteur</li>
                                <li><strong>Rapide 15' / 45'</strong> → cercle en haut à droite</li>
                                <li><strong>Essorage</strong> → cercle en bas à droite</li>
                            </ul>
                        </li>
                    </ul>
                </li>
                <li>
                    <span class="step-title">3️⃣ Ajuster si besoin</span>
                    <ul>
                        <li>Température</li>
                        <li>Vitesse d'essorage</li>
                    </ul>
                </li>
                <li class="tutorial-muted-row">
                    Les réglages de température et d'essorage se font sur l'écran de la machine (voir 1ère image).<br>
                    Les réglages par défaut conviennent dans la plupart des cas.
                </li>
                <li>
                    <span class="step-title">4️⃣ Lancer</span>
                    <ul>
                        <li>Appuyer sur <strong>▶ PLAY</strong>.</li>
                        <li>Pour ouvrir pendant un cycle : maintenir <strong>▶ 3 secondes</strong> (pause + déverrouillage).</li>
                    </ul>
                </li>
            `,
            btnText: 'Voir le sèche-linge →'
        },
        dryer: {
            title: 'Sèche-linge',
            img1: { src: 'images/tutoriels/seche-linge-screen.webp', alt: 'Sèche-linge — commandes (écran)' },
            img2: { src: 'images/tutoriels/seche-linge-selector.webp', alt: 'Sèche-linge — sélecteur de programme' },
            stepsHtml: `
                <li>
                    <span class="step-title">1️⃣ Charger le linge</span>
                    <ul>
                        <li>Mettre le linge dans le tambour, puis fermer la porte.</li>
                    </ul>
                </li>
                <li>
                    <span class="step-title">2️⃣ Choisir un programme</span>
                    <ul>
                        <li>Tourner le bouton central sur le programme souhaité (voir <strong>2ème image</strong>).</li>
                    </ul>
                </li>
                <li>
                    <span class="step-title">3️⃣ Lancer</span>
                    <ul>
                        <li>Appuyer sur <strong>▶ PLAY</strong>.</li>
                    </ul>
                </li>
            `,
            btnText: '← Voir le lave-linge'
        }
    };

    let mode = 'washer';

    function render(nextMode) {
        mode = nextMode;
        const d = DATA[mode];

        if (cardEl) cardEl.classList.add('is-switching');

        setTimeout(() => {
            titleEl.textContent = d.title;
            img1El.src = d.img1.src;  img1El.alt = d.img1.alt;
            img2El.src = d.img2.src;  img2El.alt = d.img2.alt;
            stepsEl.innerHTML = d.stepsHtml;
            btnEl.textContent = d.btnText;
            btnEl.setAttribute('aria-label', d.btnText);
            if (cardEl) cardEl.classList.remove('is-switching');
        }, 180);
    }

    btnEl.addEventListener('click', function (e) {
        e.preventDefault();
        render(mode === 'washer' ? 'dryer' : 'washer');
    });

    // premier rendu sans transition
    (function initial() {
        const d = DATA.washer;
        titleEl.textContent = d.title;
        stepsEl.innerHTML = d.stepsHtml;
        btnEl.textContent = d.btnText;
        btnEl.setAttribute('aria-label', d.btnText);
    })();
})();
</script>
</body>
</html>
